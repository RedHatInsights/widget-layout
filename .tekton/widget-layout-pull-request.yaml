apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/RedHatInsights/widget-layout?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/target-namespace: hcc-platex-services-tenant
    pipelinesascode.tekton.dev/max-keep-runs: '3'
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" && target_branch
      == "master"
    pipelinesascode.tekton.dev/pipeline: https://raw.githubusercontent.com/RedHatInsights/konflux-pipelines/9f8ad2eb4d845111b361e465edc87b656787c1e7/pipelines/platform-ui/docker-build-run-all-tests-v3.yaml
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: widget-layout
    appstudio.openshift.io/component: widget-layout
    pipelines.appstudio.openshift.io/type: build
  name: widget-layout-on-pull-request
  namespace: hcc-platex-services-tenant
spec:
  params:
    - name: git-url
      value: '{{source_url}}'
    - name: revision
      value: '{{revision}}'
    - name: output-image
      value: quay.io/redhat-user-workloads/hcc-platex-services-tenant/hcc-platex-services/widget-layout:on-pr-{{revision}}
    - name: image-expires-after
      value: 5d
    - name: dockerfile
      value: build-tools/Dockerfile.hermetic
    - name: hermetic
      value: "true"
    - name: prefetch-input
      value: '{"type": "npm", "path": "."}'
    - name: target-stage
      value: deploy
    - name: build-args
      value:
        - "LABEL_COMPONENT=widget-layout-hermetic"
        - "LABEL_DESCRIPTION=Widget Layout Frontend - Hermetic Build"
        - "LABEL_URL=https://github.com/RedHatInsights/widget-layout"
        - "LABEL_SUMMARY=Widget Layout Frontend"
    - name: workspace-setup-script
      value: |
        #!/bin/bash
        set -euo pipefail
        npm install
    - name: unit-tests-script
      value: |
        #!/bin/bash
        set -euo pipefail

        npm run lint
        npm test -- --runInBand --no-cache
    - name: e2e-tests-script
      value: |
        #!/bin/bash
        set -euo pipefail
        npm run test:playwright
    - name: run-app-command
      value: caddy
    - name: run-app-args
      value:
        - run
        - --config
        - /etc/caddy/Caddyfile
        - --adapter
        - caddyfile
    - name: e2e-playwright-image
      value: "mcr.microsoft.com/playwright:v1.59.1-noble"
    - name: frontend-proxy-routes-configmap
      value: "widget-layout-dev-proxy-caddyfile"
    - name: e2e-credentials-secret
      value: "widget-layout-credentials-secret"
    - name: e2e-app-port
      value: "8000"
    - name: e2e-base-url
      value: "https://stage.foo.redhat.com:1337/"
    - name: e2e-proxy-readiness-url
      value: "https://stage.foo.redhat.com:1337/"
  pipelineRef:
    resolver: git
    params:
      - name: url
        value: https://github.com/RedHatInsights/konflux-pipelines
      - name: revision
        value: 9f8ad2eb4d845111b361e465edc87b656787c1e7
      - name: pathInRepo
        value: pipelines/platform-ui/docker-build-run-all-tests-v3.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-widget-layout
  taskRunSpecs:
    - pipelineTaskName: run-e2e-tests
      serviceAccountName: build-pipeline-widget-layout
      podTemplate:
        hostAliases:
          - ip: "::1"
            hostnames:
              - "stage.foo.redhat.com"
          - ip: "127.0.0.1"
            hostnames:
              - "stage.foo.redhat.com"
  workspaces:
    - name: workspace
      volumeClaimTemplate:
        metadata:
          creationTimestamp: null
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
        status: {}
    - name: git-auth
      secret:
        secretName: '{{ git_auth_secret }}'
status: {}
