apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/RedHatInsights/widget-layout?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/target-namespace: hcc-platex-services-tenant
    pipelinesascode.tekton.dev/max-keep-runs: '3'
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" && target_branch
      == "master"
    pipelinesascode.tekton.dev/pipeline: https://github.com/RedHatInsights/konflux-pipelines/raw/main/pipelines/platform-ui/docker-build-run-all-tests-v2.yaml
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: widget-layout
    appstudio.openshift.io/component: widget-layout
    pipelines.appstudio.openshift.io/type: build
  name: widget-layout-on-push
  namespace: hcc-platex-services-tenant
spec:
  params:
    - name: git-url
      value: '{{source_url}}'
    - name: revision
      value: '{{revision}}'
    - name: output-image
      value: quay.io/redhat-user-workloads/hcc-platex-services-tenant/hcc-platex-services/widget-layout:{{revision}}
    - name: dockerfile
      value: build-tools/Dockerfile
    - name: unit-tests-script
      value: |
        #!/bin/bash
        set -ex

        npm install
        npm run lint
        npm test --  --runInBand --no-cache
    - name: e2e-tests-script
      value: |
        #!/bin/bash
        set -ex
        npx playwright test
    - name: run-app-script
      value: |
        #!/bin/sh
        set -e

        # Guard against Tekton nop image replacement
        # Tekton replaces sidecar images with pipelines-nop-rhel9 after tests complete
        # See: https://github.com/tektoncd/pipeline/issues/1347
        if ! command -v caddy >/dev/null 2>&1; then
          echo "Caddy not found - running in nop image, exiting gracefully"
          exit 0
        fi

        # Start Caddy to serve app assets
        caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    - name: e2e-playwright-image
      value: "mcr.microsoft.com/playwright:v1.59.1-noble"
    - name: frontend-proxy-routes-configmap
      value: "widget-layout-dev-proxy-caddyfile"
    - name: e2e-credentials-secret
      value: "widget-layout-credentials-secret"
    - name: e2e-app-port
      value: "8000"
  pipelineRef:
    resolver: git
    params:
      - name: url
        value: https://github.com/RedHatInsights/konflux-pipelines.git
      - name: revision
        value: main
      - name: pathInRepo
        value: pipelines/platform-ui/docker-build-run-all-tests-v2.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-widget-layout
  taskRunSpecs:
    - pipelineTaskName: run-unit-tests
      podTemplate:
        securityContext:
          fsGroup: 1005770000
    - pipelineTaskName: run-e2e-tests
      serviceAccountName: build-pipeline-widget-layout
      podTemplate:
        securityContext:
          fsGroup: 1005770000
        hostAliases:
          - ip: "::1"
            hostnames:
              - "stage.foo.redhat.com"
          - ip: "127.0.0.1"
            hostnames:
              - "stage.foo.redhat.com"
  workspaces:
    - name: workspace
      volumeClaimTemplate:
        metadata:
          creationTimestamp: null
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
        status: {}
    - name: git-auth
      secret:
        secretName: '{{ git_auth_secret }}'
status: {}
